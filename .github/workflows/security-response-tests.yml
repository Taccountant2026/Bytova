name: Security response checks (no deployment)
on:
  push:
    branches: ['security/php-response-2026-10-22']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: python -m unittest discover -s php-security-audit/tests -v
        env:
          PYTHONPATH: php-security-audit
