name: Bytova Remote Help — verify and guarded deploy
on:
  push:
    paths:
      - 'remote-help/**'
      - 'tests/remote-help*.test.mjs'
      - '.github/workflows/remote-help.yml'
  pull_request:
    paths:
      - 'remote-help/**'
      - 'tests/remote-help*.test.mjs'
      - '.github/workflows/remote-help.yml'
  workflow_dispatch:
    inputs:
      production_gate:
        description: 'Type ACCESS_MFA_AND_NEW_D1_VERIFIED to permit manual Worker deployment'
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Test Remote Help core and Worker routes
        run: node --test tests/remote-help.test.mjs tests/remote-help-integration.test.mjs
      - name: Confirm template does not hold credentials
        run: |
          test ! -f remote-help/wrangler.toml
          test ! -f remote-help/.dev.vars
          grep -q 'PAYMENTS_MODE = "disabled"' remote-help/wrangler.toml.example
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.production_gate == 'ACCESS_MFA_AND_NEW_D1_VERIFIED'
    needs: verify
    runs-on: ubuntu-latest
    environment: remote-help-production
    defaults:
      run:
        working-directory: remote-help
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Validate Cloudflare configuration is explicitly supplied
        env:
          DB_ID: ${{ vars.BYTOVA_REMOTE_HELP_D1_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DB_ID" =~ ^[a-fA-F0-9-]{36}$ ]] || { echo "Missing dedicated Bytova D1 identifier"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Cloudflare deployment secrets are missing"; exit 1; }
          cp wrangler.toml.example wrangler.toml
          sed -i "s/REPLACE_WITH_NEW_BYTOVA_D1_DATABASE_ID/$DB_ID/" wrangler.toml
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Apply dedicated D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply bytova-remote-help --remote --yes
      - name: Deploy Worker (live payments disabled by default)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
